<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>陣取りタップ対決</title>
<style>
  :root{
    --p1:#3b82f6; --p1-dark:#2563eb;
    --p2:#f43f5e; --p2-dark:#e11d48;
    --bg:#0d0f14; --ink:#fff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    overscroll-behavior:none;
  }
  #app{ position:fixed; inset:0; }
  .screen{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center; }
  .hidden{ display:none !important; }

  /* start screen */
  #start h1{ font-size:1.6rem; letter-spacing:.05em; margin:0; }
  #start p{ opacity:.8; line-height:1.7; max-width:320px; margin:0; }
  .time-select{ display:flex; gap:10px; }
  .time-btn, .primary-btn, .again-btn{
    font:inherit; font-weight:700; color:#fff; background:#1f2430; border:2px solid #333a4a;
    padding:12px 18px; border-radius:14px;
  }
  .time-btn.selected{ border-color:#fff; background:#2b3143; }
  .primary-btn{ background:linear-gradient(135deg,var(--p1),var(--p2)); border:none; padding:16px 40px; font-size:1.2rem; border-radius:18px; margin-top:8px; }

  /* battle field */
  #battle{ position:fixed; inset:0; display:flex; flex-direction:column; }
  .zone{ position:relative; flex-grow:50; flex-shrink:1; flex-basis:0; display:flex; align-items:center; justify-content:center; overflow:hidden; transition:flex-grow .12s ease-out; }
  #zoneP2{ background:linear-gradient(var(--p2-dark),var(--p2)); }
  #zoneP1{ background:linear-gradient(var(--p1),var(--p1-dark)); }
  .zone .inner{ display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
  #zoneP2 .inner{ transform:rotate(180deg); }
  .pct{ font-size:15vw; font-weight:800; line-height:1; text-shadow:0 4px 12px rgba(0,0,0,.25); }
  .label{ font-size:4vw; font-weight:700; opacity:.9; }
  .timer{ position:absolute; left:0; right:0; font-size:6vw; font-weight:800; opacity:.95; text-shadow:0 2px 8px rgba(0,0,0,.3); pointer-events:none; }
  #zoneP1 .timer{ bottom:10px; }
  #zoneP2 .timer{ top:10px; transform:rotate(180deg); }
  .seam{ position:absolute; left:0; right:0; top:50%; height:4px; background:rgba(255,255,255,.85); transform:translateY(-50%); z-index:5; box-shadow:0 0 10px rgba(255,255,255,.6); pointer-events:none; }

  /* countdown */
  #countdown{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; background:rgba(0,0,0,.6); }
  .cd-half{ flex:1; display:flex; align-items:center; justify-content:center; font-size:22vw; font-weight:900; }
  .cd-top{ transform:rotate(180deg); }

  /* result */
  #result{ position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; }
  .result-half{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #resultP2{ transform:rotate(180deg); background:var(--p2-dark); }
  #resultP1{ background:var(--p1-dark); }
  .result-title{ font-size:9vw; font-weight:900; }
  .result-sub{ font-size:4.5vw; opacity:.9; }
  .again-btn{ font-size:4.5vw; background:#fff; color:#111; border:none; margin-top:6px; }

  .ripple{ position:absolute; width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.55); transform:translate(-50%,-50%) scale(1); pointer-events:none; animation:ripple .5s ease-out forwards; }
  @keyframes ripple{ to{ transform:translate(-50%,-50%) scale(6); opacity:0; } }
</style>
</head>
<body>
<div id="app">

  <div id="start" class="screen">
    <h1>陣取りタップ対決</h1>
    <p>スマホ1台を2人の間に置いて対戦!<br>
       上下の画面をそれぞれ連打して、<br>
       自分の色で画面を埋め尽くそう。</p>
    <div class="time-select" id="timeSelect">
      <button class="time-btn" data-t="15">15秒</button>
      <button class="time-btn selected" data-t="20">20秒</button>
      <button class="time-btn" data-t="30">30秒</button>
    </div>
    <button class="primary-btn" id="startBtn">はじめる</button>
  </div>

  <div id="battle" class="screen hidden" style="padding:0; gap:0;">
    <div class="zone" id="zoneP2">
      <div class="inner">
        <div class="label">PLAYER 2</div>
        <div class="pct" id="pctP2">50%</div>
      </div>
      <div class="timer" id="timerP2">20</div>
    </div>
    <div class="seam"></div>
    <div class="zone" id="zoneP1">
      <div class="timer" id="timerP1">20</div>
      <div class="inner">
        <div class="pct" id="pctP1">50%</div>
        <div class="label">PLAYER 1</div>
      </div>
    </div>
  </div>

  <div id="countdown" class="hidden">
    <div class="cd-half cd-top"><span id="cdTop">3</span></div>
    <div class="cd-half cd-bottom"><span id="cdBottom">3</span></div>
  </div>

  <div id="result" class="screen hidden" style="padding:0; gap:0;">
    <div class="result-half" id="resultP2">
      <div class="result-title" id="resultTitleP2">WIN!</div>
      <div class="result-sub" id="resultSubP2">62% 対 38%</div>
    </div>
    <div class="result-half" id="resultP1">
      <div class="result-title" id="resultTitleP1">WIN!</div>
      <div class="result-sub" id="resultSubP1">62% 対 38%</div>
      <button class="again-btn" id="againBtn">もう一度あそぶ</button>
    </div>
  </div>

</div>
<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };

  var startScreen = $('start');
  var battleScreen = $('battle');
  var countdownEl = $('countdown');
  var resultScreen = $('result');

  var zoneP1 = $('zoneP1'), zoneP2 = $('zoneP2');
  var pctP1 = $('pctP1'), pctP2 = $('pctP2');
  var timerP1 = $('timerP1'), timerP2 = $('timerP2');
  var cdTop = $('cdTop'), cdBottom = $('cdBottom');

  var duration = 20;   // seconds
  var STEP = 0.6;      // % moved per tap
  var share = 50;      // 0..100, P1 (bottom) share
  var running = false;
  var endAt = 0;
  var tickHandle = null;
  var countdownHandle = null;

  var timeButtons = Array.prototype.slice.call(document.querySelectorAll('.time-btn'));
  timeButtons.forEach(function(btn){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      timeButtons.forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      duration = parseInt(btn.getAttribute('data-t'), 10);
    });
  });

  $('startBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); beginCountdown(); });
  $('againBtn').addEventListener('pointerdown', function(e){ e.preventDefault(); resultScreen.classList.add('hidden'); beginCountdown(); });

  function beginCountdown(){
    startScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    share = 50;
    updateBars();
    battleScreen.classList.remove('hidden');
    countdownEl.classList.remove('hidden');

    var n = 3;
    setCountdownText(n);
    countdownHandle = setInterval(function(){
      n -= 1;
      if(n > 0){
        setCountdownText(n);
      } else if(n === 0){
        setCountdownText('START!');
      } else {
        clearInterval(countdownHandle);
        countdownEl.classList.add('hidden');
        startBattle();
      }
    }, 700);
  }

  function setCountdownText(v){
    cdTop.textContent = v;
    cdBottom.textContent = v;
  }

  function startBattle(){
    running = true;
    endAt = Date.now() + duration * 1000;
    updateTimerDisplay(duration);
    tickHandle = setInterval(function(){
      var remain = Math.max(0, endAt - Date.now());
      var remainSec = Math.ceil(remain / 1000);
      updateTimerDisplay(remainSec);
      if(remain <= 0){
        clearInterval(tickHandle);
        running = false;
        finishBattle();
      }
    }, 100);
  }

  function updateTimerDisplay(s){
    timerP1.textContent = s;
    timerP2.textContent = s;
  }

  function updateBars(){
    var p1 = Math.round(share);
    var p2 = 100 - p1;
    zoneP1.style.flexGrow = p1;
    zoneP2.style.flexGrow = p2;
    pctP1.textContent = p1 + '%';
    pctP2.textContent = p2 + '%';
  }

  function tap(player, x, y, container){
    if(!running) return;
    if(player === 1){
      share = Math.min(100, share + STEP);
    } else {
      share = Math.max(0, share - STEP);
    }
    updateBars();
    spawnRipple(container, x, y);
  }

  function spawnRipple(container, x, y){
    var r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    container.appendChild(r);
    setTimeout(function(){ r.remove(); }, 520);
  }

  zoneP1.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var rect = zoneP1.getBoundingClientRect();
    tap(1, e.clientX - rect.left, e.clientY - rect.top, zoneP1);
  });
  zoneP2.addEventListener('pointerdown', function(e){
    e.preventDefault();
    var rect = zoneP2.getBoundingClientRect();
    tap(2, e.clientX - rect.left, e.clientY - rect.top, zoneP2);
  });

  function finishBattle(){
    var p1 = Math.round(share);
    var p2 = 100 - p1;
    var winner = p1 === p2 ? 0 : (p1 > p2 ? 1 : 2);

    $('resultTitleP1').textContent = winner === 0 ? 'DRAW' : (winner === 1 ? 'WIN!' : 'LOSE...');
    $('resultTitleP2').textContent = winner === 0 ? 'DRAW' : (winner === 2 ? 'WIN!' : 'LOSE...');
    var subText = p1 + '% 対 ' + p2 + '%';
    $('resultSubP1').textContent = subText;
    $('resultSubP2').textContent = subText;

    battleScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');
  }

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

})();
</script>
</body>
</html>
